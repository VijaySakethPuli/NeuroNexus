<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Registration Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .form-container {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .form-container h2 {
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #333;
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 0.5rem;
      font-size: 1rem;
      color: #555;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      padding: 0.8rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      background: #f9fafb;
      transition: border 0.3s, box-shadow 0.3s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    textarea:focus,
    select:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 8px rgba(66, 165, 245, 0.3);
      background: #fff;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.3rem;
    }

    .radio-group label {
      font-weight: 500;
      font-size: 1rem;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .submit-btn {
      background: #42a5f5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 0;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 12px rgba(66, 165, 245, 0.2);
      width: 100%;
    }

    .submit-btn:hover {
      background: #1e88e5;
      box-shadow: 0 6px 20px rgba(30, 136, 229, 0.3);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .form-container {
        padding: 2rem 1.5rem;
      }

      .form-container h2 {
        font-size: 1.5rem;
      }

      .submit-btn {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <form class="form-container">
    <h2>Registration Form</h2>
    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" placeholder="Enter your 10-digit phone number" title="Please enter a 10-digit phone number" required>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Enter your address" required></textarea>
    </div>
    <div class="form-group">
      <label for="company">Company Name</label>
      <input type="text" id="company" name="company" placeholder="Enter your company name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required>
    </div>
    <div class="form-group">
      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="" disabled selected>Select Department</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Marketing">Marketing</option>
        <option value="Others">Others</option>
      </select>
    </div>
    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
      </div>
    </div>
    <button type="submit" class="submit-btn">Submit</button>
  </form>
</body>
</html>
